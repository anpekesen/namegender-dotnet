# Tests on every push; a `v*` tag also packs and publishes to NuGet.
#
# Publishing uses NuGet Trusted Publishing (OIDC): no API key is stored in
# the repository. It needs a policy on nuget.org → Account → Trusted
# Publishing for owner `anpekesen`, repository `namegender-dotnet`,
# workflow `ci.yml`, and the nuget.org user name in the NUGET_USER secret.
#
# The package version comes from the tag (v0.1.0 → 0.1.0), so the version in
# the csproj cannot drift from what is published. A NuGet version can be
# unlisted but never replaced — the tests run before the push for that reason.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack src/NameGender -c Release -o out -p:Version=${GITHUB_REF_NAME#v}
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
